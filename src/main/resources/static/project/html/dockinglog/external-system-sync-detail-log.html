<div layout-fill class="content-backdrop" ng-controller="ExternalSystemSyncDetailLogController" ng-cloak>
    <div layout="column" layout-fill>
        <md-toolbar class="content-toolbar">
            <div class="md-toolbar-tools">
                <label>{{'i18n_sync_error_log' | translator:'同步异常日志'}}</label>
            </div>
        </md-toolbar>
        <div layout="row" flex cg-busy="{promise:loadingLayer,minDuration:500}">
            <div class="md-padding" layout="column" flex="100">
                <filter-tools conditions="conditions" results="filters" search="'true'" execute="list()">
                    <div class="filter-item">
                        <md-button class="md-icon-button md-whiteframe-1dp" ng-click="list()">
                            <md-tooltip md-delay="300">{{'i18n_refresh' | translator:'刷新'}}</md-tooltip>
                            <md-icon>refresh</md-icon>
                        </md-button>
                    </div>
                </filter-tools>
                <div layout="column" layout-fill>
                    <table dynamic-table items="logDetailItems" columns="logDetailColumns" execute="list({sql: sql})">
                        <tbody>
                        <tr ng-repeat="item in logDetailItems"
                            ng-class="{'tr-selected':selected === item.$$hashKey}">
                            <td ng-switch="item.type">
                                <span ng-switch-when="true">{{'i18n_sync_org' | translator:'组织机构同步'}}</span>
                                <span ng-switch-when="false">{{'i18n_sync_user' | translator:'用户同步'}}</span>
                            </td>
                            <td>{{item.name}}</td>
                            <td>{{item.createTimeText}}</td>
                            <td>
                                    <span>
                                        <a href="" style="cursor:pointer;" md-no-ink class="md-primary"
                                           ng-click="showErrMessage(item)">
                                                {{'i18n_err_msg' | translator:'异常信息'}}
                                        </a>
                                    </span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <table-pagination pagination="pagination"></table-pagination>
                </div>
            </div>
            <info-form width="50%"></info-form>
        </div>
        <side-form></side-form>
    </div>
</div>
