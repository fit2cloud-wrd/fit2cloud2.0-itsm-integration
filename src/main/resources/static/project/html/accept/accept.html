<div layout-fill class="content-backdrop" ng-controller="AcceptController" ng-cloak>
    <div layout="column" layout-fill>
        <md-toolbar class="content-toolbar">
            <div class="md-toolbar-tools">
                <label>流程列表</label>
            </div>
        </md-toolbar>
        <div layout="row" flex>
            <div layout="column" flex="100">
                <md-content class="fixed-tab short-tab">
                    <div layout-fill layout="row" cg-busy="{promise:loadingLayer,minDuration:500}" flex>
                        <div layout-fill layout="column" flex="100">
                            <filter-tools conditions="conditions" results="filters" search="'true'"
                                          execute="list()">
                                <select-columns columns="columns"></select-columns>
                                <div class="filter-item">
                                    <md-button class="md-icon-button md-whiteframe-1dp" ng-click="list()">
                                        <md-tooltip md-delay="300">{{'i18n_refresh' | translator:'刷新'}}</md-tooltip>
                                        <md-icon>refresh</md-icon>
                                    </md-button>
                                </div>
                            </filter-tools>
                            <div flex layout="column" layout-fill>
                                <table dynamic-table columns="columns" execute="list({sql: sql})">
                                    <tbody>
                                    <tr ng-repeat="item in items"
                                        ng-class="{'tr-selected':selected === item.$$hashKey}">
                                        <td></td>
                                    </tr>
                                    </tbody>
                                </table>
                                <table-pagination pagination="pagination"></table-pagination>
                            </div>
                        </div>
                    </div>
                </md-content>
            </div>
        </div>
    </div>
</div>
