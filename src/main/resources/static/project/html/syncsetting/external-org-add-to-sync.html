<div layout="column" layout-fill cg-busy="{promise:apiAccountDeleteLoadingLayer,minDuration:500}">
    <md-toolbar class="content-toolbar">
        <div class="md-toolbar-tools">
            <div>{{'i18n_add_to_sync_setting' | translator:'添加到同步设置'}}</div>
        </div>
    </md-toolbar>
    <div layout="row" flex>
        <md-content flex="100" style="overflow: hidden">
            <div>提示：以下展示的数据为将要添加到同步设置的同步机构数据，请检查无误后点击确认按钮！</div>
            <br>
            <div flex>
                <div layout="row" flex>
                    <table dynamic-table items="batchAddToSyncOrgItems" columns="wizardDeleteColumns">
                        <tbody>
                        <tr ng-repeat="item in batchAddToSyncOrgItems track by $index"
                            ng-class="{'tr-selected':selected === item.$$hashKey}">
                            <td>{{item.name}}</td>
                            <td>{{item.id}}</td>
                            <td>{{item.parentName}}</td>
                            <td>{{item.parentId}}</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </md-content>
    </div>
    <div layout="row" layout-align="start center" layout-margin>
        <md-button class="md-raised" ng-click="closeAddSyncOrgDialog()">
            {{'i18n_cancel' | translator:'取消'}}
        </md-button>
        <md-button class="md-primary md-raised" ng-click="submitAddSyncOrg()">
            {{'i18n_confirm' | translator:'确认'}}
        </md-button>
    </div>
</div>
