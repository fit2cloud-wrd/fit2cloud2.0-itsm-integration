###spring.application.name 小写
spring.application.name=itsm-integration
server.port=6635
###是否开启定时任务
module.name=$[{i18n_pcis_module_name}]
module.icon=usb
module.order=130
module.summary=$[{i18n_pcis_module_name_desc}]
module.version=V2.1.20
eureka.instance.metadata-map.server-name=${module.name}
eureka.instance.metadata-map.enable-swagger=true
eureka.client.enabled=true

# quartz enabled
quartz.enabled=true
quartz.scheduler-name=processCmdbIntegrationJob
spring.quartz.job-store-type=jdbc

# flyway enable
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=process_cmdb_integration_version
spring.flyway.baseline-version=0
spring.flyway.encoding=UTF-8
spring.flyway.validate-on-migrate=false

logging.path=/opt/fit2cloud/logs/${spring.application.name}
#????????
fit2cloud.log.max.history=30
#?????????????,??GB
fit2cloud.log.total.size.cap=2
#?????????????,??MB
fit2cloud.log.max.file.size=50

rabbit.openTimingConsume=false
